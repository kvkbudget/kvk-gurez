<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>KVK Gurez | Website Launch</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #10251a;
    }

    /* =========================
       MAIN LAUNCH SCREEN
    ========================= */

    .launch-screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at center, #315f3b 0%, #10251a 70%);
    }

    /* =========================
       CURTAINS
    ========================= */

    .curtain {
      position: absolute;
      top: 0;
      width: 52%;
      height: 100%;
      z-index: 10;

      background:
        repeating-linear-gradient(
          90deg,
          #350000 0px,
          #650000 18px,
          #8f1111 35px,
          #4a0000 52px,
          #700000 70px
        );

      box-shadow:
        inset 0 0 80px rgba(0,0,0,.7),
        0 0 40px rgba(0,0,0,.5);

      transition:
        transform 2s cubic-bezier(.77,0,.18,1);
    }

    .curtain-left {
      left: 0;
      border-right: 5px solid #d5a43b;
    }

    .curtain-right {
      right: 0;
      border-left: 5px solid #d5a43b;
    }

    .curtain::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        repeating-linear-gradient(
          90deg,
          transparent 0px,
          rgba(255,255,255,.08) 12px,
          transparent 25px,
          rgba(0,0,0,.25) 42px,
          transparent 58px
        );
    }

    /* =========================
       TOP CURTAIN ROD
    ========================= */

    .curtain-rod {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 18px;
      z-index: 20;

      background: linear-gradient(
        to bottom,
        #f5d36a,
        #a66d12,
        #f5d36a
      );

      box-shadow: 0 3px 15px rgba(0,0,0,.6);
    }

    /* =========================
       CONTENT
    ========================= */

    .launch-content {
      position: absolute;
      inset: 0;
      z-index: 30;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
      color: white;

      padding: 25px;

      animation: contentAppear 1.5s ease;
    }

    .small-title {
      font-size: 17px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 15px;
      opacity: .9;
    }

    .main-title {
      font-size: clamp(30px, 5vw, 68px);
      font-weight: 800;
      letter-spacing: 2px;

      text-shadow:
        0 4px 15px rgba(0,0,0,.7);
    }

    .subtitle {
      margin-top: 12px;
      font-size: clamp(16px, 2vw, 24px);
      letter-spacing: 1px;
    }

    .meeting {
      margin-top: 8px;
      color: #f5d36a;
      font-size: clamp(15px, 2vw, 21px);
      font-weight: bold;
    }

    /* =========================
       LAUNCH BUTTON
    ========================= */

    .launch-button {
      margin-top: 40px;

      padding: 17px 38px;

      border: 2px solid #f5d36a;
      border-radius: 50px;

      background: linear-gradient(
        135deg,
        #087a38,
        #0ca64c
      );

      color: white;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 0 20px rgba(245,211,106,.45),
        0 10px 30px rgba(0,0,0,.35);

      transition: .3s ease;

      position: relative;
      overflow: hidden;
    }

    .launch-button:hover {
      transform: scale(1.08);

      box-shadow:
        0 0 35px rgba(245,211,106,.8),
        0 15px 35px rgba(0,0,0,.5);
    }

    .launch-button:active {
      transform: scale(.96);
    }

    .launch-button::after {
      content: "";

      position: absolute;
      top: 0;
      left: -100%;

      width: 60%;
      height: 100%;

      background: rgba(255,255,255,.25);

      transform: skewX(-25deg);

      animation: shine 2.5s infinite;
    }

    @keyframes shine {
      0% { left: -100%; }
      50%,100% { left: 150%; }
    }

    /* =========================
       DECORATIVE SPARKLES
    ========================= */

    .sparkle {
      position: absolute;
      width: 5px;
      height: 5px;
      background: #f5d36a;
      border-radius: 50%;
      box-shadow: 0 0 12px #f5d36a;
      animation: sparkle 2s infinite ease-in-out;
    }

    @keyframes sparkle {
      0%,100% { opacity: .2; transform: scale(.5); }
      50% { opacity: 1; transform: scale(1.6); }
    }

    .s1 { top: 20%; left: 20%; }
    .s2 { top: 30%; right: 20%; animation-delay: .5s; }
    .s3 { bottom: 25%; left: 30%; animation-delay: 1s; }
    .s4 { bottom: 30%; right: 30%; animation-delay: 1.5s; }

    /* =========================
       OPEN ANIMATION
    ========================= */

    .launch-screen.open .curtain-left {
      transform: translateX(-100%);
    }

    .launch-screen.open .curtain-right {
      transform: translateX(100%);
    }

    .launch-screen.open .launch-content {
      opacity: 0;
      transition: opacity .5s ease;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
      .small-title { font-size: 13px; letter-spacing: 2px; }
      .main-title { font-size: 30px; line-height: 1.2; }
      .subtitle { font-size: 15px; }
      .meeting { font-size: 14px; }
      .launch-button { padding: 15px 28px; font-size: 16px; }
    }

    /* =========================
       REDUCE MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {
      .curtain { transition-duration: .5s; }
      .launch-button::after,
      .sparkle { animation: none; }
    }
  </style>
</head>

<body>

  <div class="launch-screen" id="launchScreen">

    <div class="curtain-rod"></div>
    <div class="curtain curtain-left"></div>
    <div class="curtain curtain-right"></div>

    <span class="sparkle s1"></span>
    <span class="sparkle s2"></span>
    <span class="sparkle s3"></span>
    <span class="sparkle s4"></span>

    <div class="launch-content">
      <div class="small-title">Welcome to</div>
      <h1 class="main-title">KRISHI VIGYAN KENDRA GUREZ</h1>
      <div class="subtitle">Official Website Launch</div>
      <div class="meeting">5th SAC Meeting</div>

      <button class="launch-button" onclick="launchWebsite()">
        🌐 &nbsp; LAUNCH WEBSITE
      </button>
    </div>

  </div>

  <script>
    /* ============================================================
       CONFIG — change these two values for your event
       ============================================================ */
    const EVENT_DATE   = '2026-09-06';   // the ONE day this splash is allowed to show (YYYY-MM-DD)
    const REDIRECT_URL = 'index.html';   // your real website homepage
    const STORAGE_KEY  = 'kvkGurezLaunchSeen';

    /* ============================================================
       RESET OPTION
       Visit this same file with ?reset=true in the URL, e.g.
       launch.html?reset=true
       This clears the "already seen" flag so the splash can show
       again (useful for testing, or re-running the ceremony).
       ============================================================ */
    const params = new URLSearchParams(window.location.search);
    if (params.get('reset') === 'true') {
      localStorage.removeItem(STORAGE_KEY);
    }

    /* ============================================================
       DATE + ONE-TIME CHECK
       If today is not the event date, OR this visitor has already
       clicked Launch before, skip straight to the real website —
       no curtain, no delay.
       ============================================================ */
    function todayString() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    const alreadySeen = localStorage.getItem(STORAGE_KEY) === 'true';
    const isEventDay  = todayString() === EVENT_DATE;

    if (alreadySeen || !isEventDay) {
      window.location.replace(REDIRECT_URL);
    }

    /* ============================================================
       LAUNCH BUTTON
       ============================================================ */
    function launchWebsite() {
      localStorage.setItem(STORAGE_KEY, 'true');

      const screen = document.getElementById("launchScreen");
      screen.classList.add("open");

      setTimeout(function () {
        window.location.href = REDIRECT_URL;
      }, 2100);
    }
  </script>

</body>
</html>
